name: shop_pos
description: "Offline-first POS system for small shops in Ghana"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '^3.3.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  hooks_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  mobile_scanner: ^5.2.3
  intl: ^0.19.0
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  flutter_local_notifications: ^17.2.3
  crypto: ^3.0.5
  dio: ^5.4.0
  uuid: ^4.4.0
  shared_preferences: ^2.5.5
  file_picker: ^13.1.0
  excel: ^4.0.6
  archive: ^3.6.1
  pdf: ^3.12.0
  printing: ^5.14.3
  image_picker: ^1.2.3
  print_bluetooth_thermal: ^1.2.5
  bcrypt: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0
  flutter_lints: ^5.0.0   # ← ADDED: required for analysis_options.yaml include
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/shoppos_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/shoppos_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/2.0x/
    - assets/images/3.0x/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Thin.ttf
          weight: 100
        - asset: assets/fonts/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/Inter-BoldItalic.ttf
          style: italic
          weight: 700
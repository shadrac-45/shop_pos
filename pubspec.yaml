name: shop_pos
description: "Offline-first POS system for small shops in Ghana"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.3.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  hooks_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  mobile_scanner: ^5.2.3
  intl: ^0.19.0
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0
  flutter_lints: ^5.0.0   # ← ADDED: required for analysis_options.yaml include

flutter:
  uses-material-design: true
  assets:
    - assets/